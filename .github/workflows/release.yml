name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $url -OutFile $setup
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($actual -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup download hash mismatch.' }
          $process = Start-Process $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content OdysseyInputSwitcher.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Release tag must be vMAJOR.MINOR.PATCH.' }
            if ($version -ne $Matches[1]) { throw 'Release tag must match the project version.' }
            $version = $Matches[1]
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and verify all packages
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: .\build.ps1 -Version $env:APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/OdysseyInputSwitcher-*.zip
            dist/OdysseyInputSwitcher-Setup-*.exe
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  installer-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: win-x64
          - os: windows-11-arm
            architecture: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Test native payload selection, reinstall, and uninstall
        shell: pwsh
        env:
          APP_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          Expand-Archive -LiteralPath "dist\OdysseyInputSwitcher-$env:APP_ARCHITECTURE.zip" -DestinationPath "dist\$env:APP_ARCHITECTURE"
          $installer = @(Get-ChildItem dist -Filter 'OdysseyInputSwitcher-Setup-*.exe')
          if ($installer.Count -ne 1) { throw 'Expected one universal installer.' }
          .\tests\InstallerSmoke.ps1 -Installer $installer[0].FullName -Architecture $env:APP_ARCHITECTURE

  publish:
    if: github.ref_type == 'tag'
    needs: [build, installer-test]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifest = @(Get-ChildItem packages -Filter 'SHA256SUMS-*.txt')
          if ($manifest.Count -ne 1) { throw 'Expected one checksum manifest.' }
          foreach ($line in Get-Content -LiteralPath $manifest[0].FullName) {
            if ($line -notmatch '^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$') { throw 'Malformed checksum manifest.' }
            $expected = $Matches[1]
            $path = Join-Path packages $Matches[2]
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
              throw "Artifact checksum mismatch: $path"
            }
          }
          $files = @(Get-ChildItem packages -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --verify-tag --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
